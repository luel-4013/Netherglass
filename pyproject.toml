[project]
name = "netherglass"
version = "0.1.0"
description = "Network visibility, traffic analysis, evidence preservation and authorized security-testing platform (internal deployments only)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "luel-4013" }]
keywords = ["network-security", "packet-capture", "pcap", "forensics", "tshark", "evidence", "nDR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
